<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="pfb-title pfb-desc">
  <title id="pfb-title">Akhil Yadav — Controls &amp; Automation Portfolio</title>
  <desc id="pfb-desc">Static engineering portfolio for DCS, PLC, functional safety, and renewable energy projects.</desc>
  <defs>
    <clipPath id="pfb-frame">
      <rect width="1280" height="420" rx="28"/>
    </clipPath>
    <radialGradient id="pfb-glow-cobalt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0052CC" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0052CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pfb-glow-royal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pfb-glow-teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#45A6AA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#45A6AA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pfb-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="pfb-grid-fade" cx="0.42" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="pfb-grid-mask">
      <rect width="1280" height="420" fill="url(#pfb-grid-fade)"/>
    </mask>
    <linearGradient id="pfb-wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="pfb-top-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0052CC" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3B82F6" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#45A6AA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#45A6AA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pfb-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#45A6AA" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pfb-card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132242" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#0B1324" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="pfb-card-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#pfb-frame)">
    <rect width="1280" height="420" fill="#0B1324"/>
    <ellipse cx="210" cy="40" rx="520" ry="300" fill="url(#pfb-glow-cobalt)"/>
    <ellipse cx="920" cy="110" rx="460" ry="290" fill="url(#pfb-glow-royal)"/>
    <ellipse cx="1180" cy="410" rx="430" ry="250" fill="url(#pfb-glow-teal)"/>
    <rect width="1280" height="420" fill="url(#pfb-grid)" mask="url(#pfb-grid-mask)"/>

    <!-- Subtle control loop schematic motif -->
    <g stroke="#93C5FD" stroke-opacity="0.055" stroke-width="3" fill="none">
      <circle cx="660" cy="240" r="145"/>
      <circle cx="660" cy="240" r="95" stroke-dasharray="10 10"/>
      <path d="M460 240H860M660 55V420"/>
    </g>

    <rect x="0" y="0" width="1280" height="2" fill="url(#pfb-top-line)"/>

    <!-- Eyebrow pill -->
    <g font-family="'Manrope', 'Inter', system-ui, sans-serif">
      <rect x="80" y="68" width="328" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#60A5FA" stroke-opacity="0.4"/>
      <circle cx="101" cy="84" r="8" fill="#45A6AA" fill-opacity="0.28"/>
      <circle cx="101" cy="84" r="4" fill="#45A6AA"/>
      <text x="118" y="89" font-size="12.5" font-weight="700" letter-spacing="1.6" fill="#E0F2FE">CONTROL SYSTEMS ENGINEERING PORTFOLIO</text>
    </g>

    <!-- Wordmark -->
    <text x="76" y="192" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-size="82" font-weight="800" letter-spacing="2.5" fill="url(#pfb-wordmark)">AKHIL YADAV</text>

    <!-- Tagline -->
    <text x="80" y="240" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-size="25" font-weight="500" fill="#CBD5E1">DCS, PLC, functional safety, and renewable energy engineering</text>

    <!-- Feature chips -->
    <g font-family="'Manrope', 'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">
      <rect x="80" y="280" width="120" height="36" rx="18" fill="#0052CC" fill-opacity="0.28" stroke="#60A5FA" stroke-opacity="0.6"/>
      <text x="140" y="303" fill="#BFDBFE">ABB 800xA</text>

      <rect x="212" y="280" width="154" height="36" rx="18" fill="#45A6AA" fill-opacity="0.18" stroke="#45A6AA" stroke-opacity="0.6"/>
      <text x="289" y="303" fill="#CCFBF1">CENTUM / STARDOM</text>

      <rect x="378" y="280" width="132" height="36" rx="18" fill="#2563EB" fill-opacity="0.2" stroke="#60A5FA" stroke-opacity="0.55"/>
      <text x="444" y="303" fill="#DBEAFE">Solar &amp; Wind</text>

      <rect x="522" y="280" width="144" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="594" y="303" fill="#F0F4F9">Zero-Build SPA</text>
    </g>

    <!-- Stack line -->
    <text x="80" y="366" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" letter-spacing="0.4" fill="#94A3B8">HTML5 · CSS3 Container Queries · Vanilla JS · GitHub Pages</text>

    <!-- Right topology card -->
    <rect x="846" y="48" width="352" height="296" rx="22" fill="#FFFFFF" fill-opacity="0.025" stroke="#60A5FA" stroke-opacity="0.2" transform="rotate(4 1022 196)"/>
    <rect x="826" y="64" width="372" height="296" rx="22" fill="url(#pfb-card-fill)"/>
    <rect x="826" y="64" width="372" height="118" rx="22" fill="url(#pfb-card-sheen)"/>
    <rect x="826.75" y="64.75" width="370.5" height="294.5" rx="21.25" fill="none" stroke="url(#pfb-card-border)" stroke-width="1.5"/>

    <g font-family="'Manrope', system-ui, sans-serif">
      <text x="854" y="102" font-size="17" font-weight="700" fill="#F8FAFC">Plant &amp; portfolio map</text>
      <rect x="1076" y="84" width="98" height="26" rx="13" fill="#45A6AA" fill-opacity="0.2" stroke="#45A6AA" stroke-opacity="0.55"/>
      <text x="1125" y="101" font-size="11.5" font-weight="700" text-anchor="middle" fill="#CCFBF1">5 Tabs · 7 Cases</text>

      <!-- Architecture blocks -->
      <rect x="854" y="130" width="96" height="62" rx="12" fill="#0052CC" fill-opacity="0.24" stroke="#60A5FA" stroke-opacity="0.55"/>
      <text x="902" y="157" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">DCS</text>
      <text x="902" y="176" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle" fill="#BFDBFE">800xA · VP</text>

      <rect x="964" y="130" width="96" height="62" rx="12" fill="#45A6AA" fill-opacity="0.18" stroke="#45A6AA" stroke-opacity="0.55"/>
      <text x="1012" y="157" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">SAFETY</text>
      <text x="1012" y="176" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle" fill="#CCFBF1">SIS · SIL</text>

      <rect x="1074" y="130" width="98" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="1123" y="157" font-size="13" font-weight="800" text-anchor="middle" fill="#FFFFFF">SOLAR</text>
      <text x="1123" y="176" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle" fill="#CBD5E1">EPC · HV</text>

      <!-- Metrics row -->
      <rect x="854" y="210" width="318" height="84" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="872" y="236" font-size="12.5" font-weight="700" fill="#E2E8F0">Interactive SPA modules</text>
      <text x="872" y="258" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#93C5FD">About · Projects · Skills · Resume · Contact</text>
      <text x="872" y="278" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">Hash routing · Filter tags · Lightbox · Copy</text>

      <line x1="854" y1="316" x2="1172" y2="316" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="854" y="338" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">Zero dependencies · 10 industrial platforms</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>

