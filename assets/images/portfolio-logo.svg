<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="pf-logo-title">
  <title id="pf-logo-title">Akhil Yadav Controls Engineering Portfolio Logo</title>
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132242"/>
      <stop offset="1" stop-color="#0B1324"/>
    </linearGradient>
    <linearGradient id="pf-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#45A6AA"/>
    </linearGradient>
    <pattern id="pf-mini-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#60A5FA" stroke-opacity="0.12" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#pf-bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#pf-mini-grid)"/>
  <!-- Outer blueprint hexagon/frame -->
  <rect x="16" y="16" width="96" height="96" rx="18" fill="none" stroke="#60A5FA" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- AY Monogram -->
  <path d="M29 88L46 40L63 88M35 73H57" fill="none" stroke="#F0F4F9" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 40L83 65L98 40M83 65V88" fill="none" stroke="url(#pf-accent)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SCADA active node -->
  <circle cx="98" cy="28" r="5" fill="#45A6AA"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>

